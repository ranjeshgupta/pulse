# Pulse in production on one server (e.g. a 6 vCPU / 12 GB VPS), behind Cloudflare.
#
# - No database, queue or cache port is published: they talk on the private compose network only.
# - Pulse listens on 127.0.0.1:7070 only; Caddy (host network) is the one public entry, on 80/443,
#   and the host firewall lets only Cloudflare reach those (see firewall.sh).
# - Every secret comes from .env (made by gen-secrets.sh), never from this file.
# - Memory is capped per service for a 12 GB machine; raise the numbers on a bigger one.
#
# Start: docker compose --env-file .env up -d --build   (install.sh does this)
name: pulse

x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Events are stored in ClickHouse and Postgres; Kafka only needs to hold a few days.
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1600m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    logging: *logging
    environment:
      CLICKHOUSE_DB: pulse
      CLICKHOUSE_USER: pulse
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:?run gen-secrets.sh first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/small-server.xml:/etc/clickhouse-server/config.d/small-server.xml:ro
      - ./backups/clickhouse:/backups
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    command: ["postgres", "-c", "shared_buffers=768MB", "-c", "effective_cache_size=2GB", "-c", "work_mem=16MB",
              "-c", "maintenance_work_mem=256MB", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run gen-secrets.sh first}
      POSTGRES_DB: pulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 2g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    # noeviction: Redis holds segment members and dedupe keys, which must never be dropped silently;
    # at the limit writes fail and the pipeline waits (it logs "store or network unavailable").
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 2500mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run gen-secrets.sh first}
    volumes:
      - redis-data:/data
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30

  pulse:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pulse:local
    restart: unless-stopped
    logging: *logging
    command: ["all"]
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PULSE_HTTP_ADDR: ":7070"
      PULSE_PG_DSN: postgres://pulse:${PG_PASSWORD}@postgres:5432/pulse?sslmode=disable
      PULSE_CH_ADDR: clickhouse:9000
      PULSE_CH_DB: pulse
      PULSE_CH_USER: pulse
      PULSE_CH_PASSWORD: ${CH_PASSWORD}
      PULSE_CH_QUERY_MAX_MEMORY: "2147483648"
      PULSE_REDIS_ADDR: redis:6379
      PULSE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      PULSE_KAFKA_BROKERS: kafka:9092
      PULSE_PUBLIC_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
      PULSE_PAGES_URL: https://${PAGES_DOMAIN:?set PAGES_DOMAIN in .env}
      PULSE_SECRET_KEY: ${PULSE_SECRET_KEY:?run gen-secrets.sh first}
      PULSE_ADMIN_TOKEN: ${PULSE_ADMIN_TOKEN:?run gen-secrets.sh first}
      PULSE_ALLOW_SIGNUP: "false"
      # Logins several people share, such as a public demo: their password and two-step sign-in are fixed.
      PULSE_SHARED_LOGINS: ${PULSE_SHARED_LOGINS:-}
      # Behind Cloudflare: the client IP comes from CF-Connecting-IP. Safe only because the firewall
      # lets nothing but Cloudflare reach the server (firewall.sh).
      PULSE_TRUST_PROXY: "true"
      PULSE_TRUST_CLOUDFLARE: "true"
      # The default email relay for workspaces without their own provider (optional).
      PULSE_SMTP_ADDR: ${SMTP_ADDR:-}
      PULSE_SMTP_FROM: ${SMTP_FROM:-}
      PULSE_AI_API_KEY: ${PULSE_AI_API_KEY:-}
    ports:
      - "127.0.0.1:7070:7070" # Caddy and the scripts on this host only
    mem_limit: 2g

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    # Host network, so the host firewall (ufw) decides who reaches 80/443; Docker's own published
    # ports would bypass it.
    network_mode: host
    depends_on: [pulse]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      PAGES_DOMAIN: ${PAGES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    mem_limit: 256m

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  redis-data:
  caddy-data:
