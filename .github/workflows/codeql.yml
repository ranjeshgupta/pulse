# CodeQL code scanning for every language in the repository. Go and JavaScript/TypeScript are
# analysed from source; the mobile SDKs are compiled so CodeQL sees the real build: the Android SDK
# (Kotlin) with Gradle, which the automatic setup couldn't find under sdks/android, and the iOS SDK
# (Swift) for the iOS Simulator on macOS.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, so new queries run on unchanged code too

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The Ubuntu runner has the Android SDK (ANDROID_HOME), so both pulse-core and pulse-android build.
      - if: matrix.language == 'java-kotlin'
        working-directory: sdks/android
        run: gradle assemble --no-daemon --stacktrace

      - if: matrix.language == 'swift'
        working-directory: sdks/ios
        run: |
          xcodebuild build -scheme Pulse-Package -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 40   # steps run with pipefail: a failed build fails the step

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
