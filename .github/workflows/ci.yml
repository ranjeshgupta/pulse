# Checks every push and pull request: the Go server, the web app, and the iOS SDK (which needs
# macOS: its UIKit and notification code only compiles for Apple platforms). The end-to-end and UI
# crawl suites need the full Docker stack and run locally (make e2e, make ui-crawl).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ios-sdk:
    runs-on: macos-15
    defaults:
      run:
        working-directory: sdks/ios
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (macOS)
        run: swift test
      - name: Build every target for iOS
        run: |
          xcodebuild -list
          xcodebuild build -scheme Pulse-Package -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 40   # steps run with pipefail: a failed build fails the step
